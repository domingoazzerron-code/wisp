name: Unzip project
on:
  push:
    paths:
      - project.zip
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          if [ ! -f project.zip ]; then exit 0; fi
          unzip -o project.zip
          rm project.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack project files"
          git push
